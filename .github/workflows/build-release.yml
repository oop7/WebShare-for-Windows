name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install cx_Freeze
    
    - name: Create cx_Freeze setup script
      run: |
        New-Item -Path "setup_build.py" -ItemType File -Force
        Add-Content -Path "setup_build.py" -Value "from cx_Freeze import setup, Executable"
        Add-Content -Path "setup_build.py" -Value ""
        Add-Content -Path "setup_build.py" -Value "build_exe_options = dict("
        Add-Content -Path "setup_build.py" -Value "    optimize=2,"
        Add-Content -Path "setup_build.py" -Value "    packages=["
        Add-Content -Path "setup_build.py" -Value '        "PySide6.QtCore",'
        Add-Content -Path "setup_build.py" -Value '        "PySide6.QtGui",'
        Add-Content -Path "setup_build.py" -Value '        "PySide6.QtWidgets",'
        Add-Content -Path "setup_build.py" -Value '        "flask",'
        Add-Content -Path "setup_build.py" -Value '        "waitress",'
        Add-Content -Path "setup_build.py" -Value '        "qrcode",'
        Add-Content -Path "setup_build.py" -Value '        "PIL",'
        Add-Content -Path "setup_build.py" -Value "    ],"
        Add-Content -Path "setup_build.py" -Value "    excludes=["
        Add-Content -Path "setup_build.py" -Value '        "PySide6.QtBluetooth",'
        Add-Content -Path "setup_build.py" -Value '        "PySide6.QtNetwork",'
        Add-Content -Path "setup_build.py" -Value '        "PySide6.QtOpenGL",'
        Add-Content -Path "setup_build.py" -Value '        "PySide6.QtPrintSupport",'
        Add-Content -Path "setup_build.py" -Value '        "PySide6.QtSvg",'
        Add-Content -Path "setup_build.py" -Value '        "PySide6.QtTest",'
        Add-Content -Path "setup_build.py" -Value '        "PySide6.QtXml",'
        Add-Content -Path "setup_build.py" -Value '        "PySide6.QtSql",'
        Add-Content -Path "setup_build.py" -Value '        "PySide6.QtHelp",'
        Add-Content -Path "setup_build.py" -Value '        "PySide6.QtMultimedia",'
        Add-Content -Path "setup_build.py" -Value '        "PySide6.QtQml",'
        Add-Content -Path "setup_build.py" -Value '        "PySide6.QtQuick",'
        Add-Content -Path "setup_build.py" -Value '        "PySide6.QtWebEngineCore",'
        Add-Content -Path "setup_build.py" -Value '        "numpy",'
        Add-Content -Path "setup_build.py" -Value '        "pandas",'
        Add-Content -Path "setup_build.py" -Value '        "matplotlib",'
        Add-Content -Path "setup_build.py" -Value '        "scipy",'
        Add-Content -Path "setup_build.py" -Value '        "tkinter",'
        Add-Content -Path "setup_build.py" -Value '        "PyQt5",'
        Add-Content -Path "setup_build.py" -Value '        "PyQt6",'
        Add-Content -Path "setup_build.py" -Value '        "unittest",'
        Add-Content -Path "setup_build.py" -Value '        "test",'
        Add-Content -Path "setup_build.py" -Value "    ],"
        Add-Content -Path "setup_build.py" -Value "    include_files=["
        Add-Content -Path "setup_build.py" -Value '        ("app/templates", "app/templates"),'
        Add-Content -Path "setup_build.py" -Value '        ("config.example.json", "config.example.json"),'
        Add-Content -Path "setup_build.py" -Value '        ("README.md", "README.md"),'
        Add-Content -Path "setup_build.py" -Value '        ("LICENSE", "LICENSE"),'
        Add-Content -Path "setup_build.py" -Value "    ],"
        Add-Content -Path "setup_build.py" -Value ")"
        Add-Content -Path "setup_build.py" -Value ""
        Add-Content -Path "setup_build.py" -Value "executables = ["
        Add-Content -Path "setup_build.py" -Value "    Executable("
        Add-Content -Path "setup_build.py" -Value '        script="main.py",'
        Add-Content -Path "setup_build.py" -Value '        target_name="WebShare-for-Windows.exe",'
        Add-Content -Path "setup_build.py" -Value '        base="Win32GUI",'
        Add-Content -Path "setup_build.py" -Value '        icon="app/templates/icon/icon48.png",'
        Add-Content -Path "setup_build.py" -Value "    )"
        Add-Content -Path "setup_build.py" -Value "]"
        Add-Content -Path "setup_build.py" -Value ""
        Add-Content -Path "setup_build.py" -Value "setup("
        Add-Content -Path "setup_build.py" -Value '    name="WebShare-for-Windows",'
        Add-Content -Path "setup_build.py" -Value '    version="1.3.0",'
        Add-Content -Path "setup_build.py" -Value '    description="WebShare for Windows",'
        Add-Content -Path "setup_build.py" -Value '    options={"build_exe": build_exe_options},'
        Add-Content -Path "setup_build.py" -Value "    executables=executables,"
        Add-Content -Path "setup_build.py" -Value ")"
    
    - name: Build with cx_Freeze
      run: |
        python setup_build.py build_exe --build-exe "dist\WebShare-for-Windows"
        New-Item -ItemType Directory -Force -Path dist/WebShare-for-Windows/uploads
        New-Item -ItemType Directory -Force -Path dist/WebShare-for-Windows/logs
    
    - name: Create portable package with 7-Zip
      run: |
        7z a -tzip -mx=9 WebShare-for-Windows-${{ github.ref_name }}-Windows-Portable.zip ./dist/WebShare-for-Windows/*
    
    - name: Calculate SHA256
      id: hash
      run: |
        $hash = (Get-FileHash WebShare-for-Windows-${{ github.ref_name }}-Windows-Portable.zip -Algorithm SHA256).Hash
        echo "sha256=$hash" >> $env:GITHUB_OUTPUT
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        files: WebShare-for-Windows-${{ github.ref_name }}-Windows-Portable.zip
        body: |
          ## WebShare for Windows ${{ github.ref_name }}
          - SHA256: ${{ steps.hash.outputs.sha256 }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
